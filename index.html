<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegient Ltd</title>
  <meta name="description" content="Aegient Ltd — registered company in England and Wales. Operator of getquiet.co.uk." />
  <meta name="robots" content="index, follow" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --teal:           #1d9e75;
      --bg-tertiary:    #eeece7;
      --bg-primary:     #ffffff;
      --text-primary:   #2c2c2a;
      --text-secondary: #5f5e5a;
      --text-tertiary:  #888780;
      --border-subtle:  rgba(44, 44, 42, 0.12);
      --radius-lg:      12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    html, body {
      min-height: 100svh;
      background: var(--bg-tertiary);
      font-family: var(--font);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }

    .card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 460px;
    }

    .wordmark {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      margin-bottom: 1.75rem;
    }

    hr {
      border: none;
      border-top: 0.5px solid var(--border-subtle);
      margin-bottom: 1.75rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.25rem;
    }

    .value {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    a {
      color: var(--teal);
      text-decoration: none;
      transition: color 0.15s;
    }

    a:hover {
      color: var(--text-primary);
    }

    footer {
      margin-top: 1.5rem;
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="wordmark">Aegient Ltd</div>
    <hr />

    <div class="field">
      <div class="label">Registered company</div>
      <div class="value">England and Wales &mdash; No. 17154349</div>
    </div>

    <div class="field">
      <div class="label">Registered address</div>
      <div class="value">3a Park Avenue<br />Lytham St Annes<br />Lancashire FY8 5QU</div>
    </div>

    <div class="field">
      <div class="label">Product</div>
      <div class="value">Operator of <a href="https://getquiet.co.uk">getquiet.co.uk</a></div>
    </div>

    <div class="field">
      <div class="label">Contact</div>
      <div class="value"><a href="mailto:hello@aegient.com">hello@aegient.com</a></div>
    </div>
  </div>

  <footer>
    &copy; 2026 Aegient Ltd. Registered in England and Wales.
  </footer>

</body>
</html>
